<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloom of Twilight</title>
  <meta name="description" content="her robes are gloom of twilight... - Dead Sea Scrolls (4Q184 1:5)">
  <meta name="theme-color" content="#12100e">
  <!-- Icons are crops of the background image sharing one white-point lift.
       favicon.ico holds 16/32/48 of a tight crop on the figure, so the
       silhouette still reads at 16px; the two PNGs use a wider crop (tree,
       figure, shoreline) that only holds together at large sizes. Browsers
       request /favicon.ico and /apple-touch-icon.png from the root with or
       without these tags -- the tags just make it deterministic. Recheck any
       replacement at 16px, where the figure is a few pixels wide. -->
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="icon-512.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/chomsky-webfont.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lato-400.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Background image is AI-generated. Preloads are media-scoped so each viewport
       fetches exactly one of the two files; the conditions must stay exact
       complements of each other and match the @media block in style.css. -->
  <link rel="preload" href="gloom-of-twilight-background.png" as="image"
        media="not all and (max-width: 500px)">
  <link rel="preload" href="gloom-of-twilight-background-phone.png" as="image"
        media="(max-width: 500px)">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <figure>
    <blockquote><p>her robes are gloom of twilight...</p></blockquote>
    <figcaption>- Dead Sea Scrolls (4Q184 1:5)</figcaption>
  </figure>
</body>
</html>
